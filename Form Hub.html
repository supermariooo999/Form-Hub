<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormHub</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        
    </style>
</head>

<body>

    <div class="min-h-screen flex flex-col">

        <!-- =====================================================
        HEADER
        ====================================================== -->
        <header class="main-header sticky top-0 z-50 h-[68px]">
            <div class="mx-auto flex h-full max-w-[1180px] items-center justify-between px-6">

                <div class="flex items-center gap-3">
                    <div class="logo-box flex h-10 w-10 items-center justify-center rounded-2xl text-white">
                        <i data-lucide="layout-grid" class="h-[18px] w-[18px]"></i>
                    </div>
                    <div>
                        <div class="text-[16px] font-extrabold tracking-[-0.3px] text-[#1a1a2e]">
                            FormHub
                        </div>
                        <div class="text-[10px] font-medium text-[#64748b] tracking-[0.5px]">
                            ✦ Đa sắc
                        </div>
                    </div>
                </div>

                <div class="search-box hidden h-10 w-[280px] items-center gap-2 rounded-2xl px-4 md:flex">
                    <i data-lucide="search" class="h-4 w-4 text-[#94a3b8]"></i>
                    <input
                        id="searchInput"
                        type="text"
                        placeholder="Tìm biểu mẫu..."
                        class="w-full bg-transparent text-[13px] outline-none placeholder:text-[#94a3b8] font-medium"
                    >
                </div>

            </div>
        </header>

        <!-- =====================================================
        CONTENT
        ====================================================== -->
        <main class="mx-auto w-full max-w-[1180px] flex-1 px-6 py-10">

            <!-- Page title -->
            <div class="mb-10">
                <div class="mb-2 flex items-center gap-2">
                    <span class="inline-flex h-6 w-6 items-center justify-center rounded-full bg-gradient-to-r from-[#667eea] to-[#764ba2] text-[10px] font-extrabold text-white">
                        ✦
                    </span>
                    <span class="text-[11px] font-bold uppercase tracking-[1.5px] text-[#94a3b8]">
                        Bộ sưu tập
                    </span>
                    <span
                        id="formCount"
                        class="rounded-full bg-white px-4 py-1.5 text-[11px] font-bold text-[#64748b] shadow-sm border border-[#e2e8f0]"
                    >
                        0 biểu mẫu
                    </span>
                </div>
            </div>

            <!-- Form List -->
            <div
                id="formList"
                class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3"
            >
                <!-- Render bằng JS -->
            </div>

        </main>

        <!-- =====================================================
        FOOTER
        ====================================================== -->
        <footer class="mx-auto w-full max-w-[1180px] px-6 pb-8">
            <div class="footer-line mb-4"></div>
            <div class="flex items-center justify-between text-[11px] font-bold text-[#94a3b8]">
                <span>✦ FormHub</span>
                <span class="bg-gradient-to-r from-[#667eea] to-[#764ba2] bg-clip-text text-transparent">✦ Đa sắc ✦</span>
            </div>
        </footer>

    </div>

    <!-- =====================================================
    JAVASCRIPT
    ====================================================== -->
    <script>
        const forms = [
            {
                id: 1,
                code: 'gnt',
                title: 'Giấy nộp tiền vào NSNN',
                description: 'Giấy nộp tiền vào ngân sách nhà nước',
                category: 'NNT',
                icon: 'users',
                theme: 'color-theme-1'
            }, 
            {
                id: 2,
                code: 'pchs',
                title: 'Phiếu chuyển hồ sơ',
                description: 'Phiếu chuyển hồ sơ nội bộ.',
                category: 'CBT',
                icon: 'message-square',
                theme: 'color-theme-2'
            }, 
            {
                id: 3,
                code: 'mau_24_dkt',
                title: 'Mẫu 24/ĐKT - Đề nghị chấm dứt hiệu lực mã số thuế',
                description: 'Mẫu 24/ĐKT - Đề nghị chấm dứt hiệu lực mã số thuế',
                category: 'NNT',
                icon: 'calendar',
                theme: 'color-theme-3'
            }, 
            // {
            //     id: 4,
            //     title: 'Đánh giá hiệu suất',
            //     description: 'Đánh giá kết quả làm việc và đề xuất mục tiêu phát triển cá nhân.',
            //     category: 'Nhân sự',
            //     icon: 'bar-chart-3',
            //     theme: 'color-theme-4'
            // }, 
            // {
            //     id: 5,
            //     title: 'Đề xuất ý tưởng',
            //     description: 'Gửi ý tưởng sáng tạo, cải tiến quy trình và sản phẩm của công ty.',
            //     category: 'Sáng tạo',
            //     icon: 'lightbulb',
            //     theme: 'color-theme-5'
            // }, 
            // {
            //     id: 6,
            //     title: 'Khảo sát thị trường',
            //     description: 'Nghiên cứu xu hướng và nhu cầu của khách hàng mục tiêu.',
            //     category: 'Nghiên cứu',
            //     icon: 'trending-up',
            //     theme: 'color-theme-6'
            // }
        ];

        function renderForms(filter = '') {
            const list = document.getElementById('formList');
            const count = document.getElementById('formCount');

            const filtered = forms.filter(f =>
                f.title.toLowerCase().includes(filter.toLowerCase()) ||
                f.category.toLowerCase().includes(filter.toLowerCase())
            );

            list.innerHTML = filtered.map(f => `
                <div 
                    class="form-card ${f.theme} cursor-pointer"
                    data-code="${f.code}"
                >
                    <span class="order-badge">
                        #${String(f.id).padStart(2, '0')}
                    </span>

                    <div class="icon-wrapper">
                        <i data-lucide="${f.icon}" class="h-5 w-5"></i>
                    </div>

                    <div class="form-title">${f.title}</div>

                    <p class="form-desc">${f.description}</p>

                    <div class="form-meta">
                        <span class="category-tag">${f.category}</span>

                        <span style="margin-left:auto; opacity:0.5;">
                            ✦
                        </span>

                        <button class="action-btn" type="button">
                            Mở
                            <i data-lucide="arrow-right" class="h-3 w-3"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            count.textContent = `${filtered.length} biểu mẫu`;

            // Click vào card
            document.querySelectorAll('.form-card').forEach(card => {
                card.addEventListener('click', () => {
                    const code = card.dataset.code;
                    window.open(`xforms/${code}/${code}.html`, '_blank');
                });
            });

            lucide.createIcons();
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            renderForms(this.value);
        });

        renderForms();
        lucide.createIcons();
    </script>

</body>

</html>
